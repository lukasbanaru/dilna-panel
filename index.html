<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Dílna – spouštění</title>
<style>
:root{--bg:#ffffff;--fg:#37352f;--card:#f7f6f3;--bd:#e9e9e7;--btn:#ffffff;--hov:#efefed;--mut:#787774}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191919;--fg:#e6e6e4;--card:#202020;--bd:#2f2f2f;--btn:#2a2a2a;--hov:#363636;--mut:#9b9a97}}
:root[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--card:#202020;--bd:#2f2f2f;--btn:#2a2a2a;--hov:#363636;--mut:#9b9a97}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;padding:8px;color:var(--fg);font:14px/1.35 ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.t{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
.n{font-weight:600;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i{margin-right:6px}
.b{display:flex;gap:6px}
.b a{display:inline-block;background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px 9px;text-decoration:none;text-align:center;white-space:nowrap}
.b a.run{flex:1}
.b a:hover{background:var(--hov)}
#s{margin-top:8px;font-size:13px;color:var(--mut);min-height:1.3em}
#s.err{color:#e03e3e}
</style>
</head>
<body>
<div id="g"></div>
<div id="s"></div>
<script>
/*
  Dílna – panel tlačítek pro Notion (embed).

  Statická stránka bez backendu. Tlačítka jen otevírají odkazy na http://localhost:47100
  – tedy na počítač toho, kdo klikne. Na serveru, kde stránka visí, se nic nespouští.

  Token se NEukládá sem, předává se v odkazu:  .../?t=<token>
  Volitelně téma:                               .../?t=<token>&theme=dark  (nebo light)

  Seznam musí odpovídat $Projekty v bany-launcher.ps1 (id = klíč).
*/
const PROJEKTY = [
  { id: "analyzer",    name: "AutoskolyAnalyzer",    icon: "📊" },
  { id: "planovani",   name: "Plánování zkoušek PJ", icon: "📅", noCode: true },
  { id: "web",         name: "Webovky autoškoly",    icon: "🚗" },
  { id: "vypisky",     name: "Studijní AI systém",   icon: "🎓" },
  { id: "extension",   name: "ClassicsExtension",    icon: "🧩" },
  { id: "gtnh",        name: "GTNH guide tool",      icon: "⚙️" },
  { id: "segmentace",  name: "Segmentace",           icon: "🧮" },
  { id: "judl",        name: "Stránky Judla",        icon: "🌐" },
  { id: "claude-sync", name: ".claude_sync",         icon: "🔄" }
];
const LAUNCHER = "http://localhost:47100";

const q = new URLSearchParams(location.search);
const h = new URLSearchParams(location.hash.slice(1));
const token = (q.get("t") || h.get("t") || "").replace(/[^a-z0-9]/gi, "");
const theme = q.get("theme") || h.get("theme");
if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;

const g = document.getElementById("g");
const s = document.getElementById("s");

function btn(akce, p, label, title, cls) {
  const a = document.createElement("a");
  a.href = LAUNCHER + "/" + token + "/" + akce + "/" + p.id;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = label;
  if (title) a.title = title;
  if (cls) a.className = cls;
  a.addEventListener("click", () => { s.className = ""; s.textContent = label + " · " + p.name + " – otevírá se karta launcheru…"; });
  return a;
}

if (!token) {
  s.className = "err";
  s.textContent = "Chybí token v odkazu (…/?t=…).";
} else {
  for (const p of PROJEKTY) {
    const t = document.createElement("div"); t.className = "t";
    const n = document.createElement("div"); n.className = "n";
    const i = document.createElement("span"); i.className = "i"; i.textContent = p.icon;
    n.append(i, p.name);
    const b = document.createElement("div"); b.className = "b";
    b.append(btn("run", p, "▶ Spustit", null, "run"));
    if (!p.noCode) b.append(btn("code", p, "💻", "Otevřít ve VS Code"));
    b.append(btn("folder", p, "📂", "Otevřít složku"));
    t.append(n, b);
    g.append(t);
  }
}
</script>
</body>
</html>
